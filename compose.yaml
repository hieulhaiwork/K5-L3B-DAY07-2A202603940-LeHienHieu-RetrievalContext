name: lab7_reproduction
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: day6_lab
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55434}:5432"
    volumes:
      - lab7_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d day6_lab"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  lab7_pgdata:
